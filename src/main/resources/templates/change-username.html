<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Change Username - Yu-Gi-Oh! Turbo</title>

  <link rel="stylesheet" th:href="@{/css/change-username.css}">
</head>

<body>

<div class="change-container">

  <h1>Change Username</h1>

  <form action="/change-username" method="post">

    <label for="newUsername">New Username</label>

    <input
            id="newUsername"
            type="text"
            name="newUsername"
            placeholder="New Username"
            required>

    <button type="submit">
      Change Username
    </button>

  </form>

  <p
          th:if="${error}"
          th:text="${error}"
          class="error">
  </p>

  <a href="/account">
    Back to Account
  </a>

</div>

</body>
</html>
