<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Account - Yu-Gi-Oh! Turbo</title>

  <link rel="stylesheet" th:href="@{/css/account.css}">
</head>

<body>

<div class="account-container">

  <h1>Account</h1>

  <p>
    Logged in as:
    <strong th:text="${username}">Username</strong>
  </p>

  <a href="/change-username" class="button">
    Change Username
  </a>

  <a href="/delete-account" class="button danger">
    Delete Account
  </a>

  <form action="/logout" method="post">
    <button type="submit" class="button">
      Logout
    </button>
  </form>

  <a href="/menu">
    Back to Menu
  </a>

</div>

</body>
</html>
